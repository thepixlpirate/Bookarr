<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bookarr icon: an open book catching a download arrow. Original artwork, Bookarr purple + teal. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#a879ff"/>
      <stop offset="1" stop-color="#5a2bd6"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebe4ff"/>
    </linearGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ff1dc"/>
      <stop offset="1" stop-color="#16b5a3"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="248" fill="#221447"/>
  <circle cx="256" cy="256" r="230" fill="url(#bg)"/>
  <g transform="translate(256 266) scale(.9) translate(-256 -244)">
  <g stroke="#221447" stroke-width="14" stroke-linejoin="round" paint-order="stroke">
    <!-- book cover peeking under the pages -->
    <path d="M96 248 L96 386 C 160 372, 214 378, 256 404 C 298 378, 352 372, 416 386 L416 248 Z" fill="#2dd4bf"/>
    <!-- pages -->
    <path d="M248 384 C 210 356, 158 348, 112 358 L 112 228 C 158 218, 210 226, 248 254 Z" fill="url(#pg)"/>
    <path d="M264 384 C 302 356, 354 348, 400 358 L 400 228 C 354 218, 302 226, 264 254 Z" fill="url(#pg)"/>
  </g>
  <g fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="10" stroke-linecap="round">
    <path d="M144 280 C 172 274, 198 278, 220 290"/><path d="M144 316 C 172 310, 198 314, 220 326"/>
    <path d="M368 280 C 340 274, 314 278, 292 290"/><path d="M368 316 C 340 310, 314 314, 292 326"/>
  </g>
  <!-- download arrow landing in the spine -->
  <path d="M228 84 h56 v94 h52 l-80 86 l-80 -86 h52 z" fill="url(#ar)" stroke="#221447" stroke-width="14" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
