<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookarr</title><meta name="color-scheme" content="dark"><script src="/initialize.js"></script>
<style>
:root{color-scheme:dark;--black:#0a0a0f;--ink:#111118;--g1:#1a1b23;--g2:#23252f;--line:#2c2f3b;--tx:#e7e8ee;--mu:#8d90a0;--pu:#8b5cf6;--te:#2dd4bf;--bl:#4f9dff}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;height:100dvh;overflow:hidden}html{height:100%;overflow:hidden;overscroll-behavior:none}
nav{width:210px;flex:none;background:var(--black);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 0;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700;padding:4px 18px 18px}
nav a{display:block;padding:9px 18px;color:var(--mu);cursor:pointer;border-left:3px solid transparent}nav a:hover{color:var(--tx);background:var(--g1)}
nav a.on{color:var(--tx);background:var(--g1);border-left-color:var(--pu)}nav hr{border:0;border-top:1px solid var(--line);margin:10px 0;width:100%}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
header{background:var(--g1);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0;font-weight:600}header .sp{flex:1}
input,select,button{background:var(--g2);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font:inherit}
input::placeholder{color:#666a7a}button{cursor:pointer}button:hover{border-color:#464a5b}button.p{background:var(--te);border-color:var(--te);color:#04201c;font-weight:600}
button.pu{background:var(--pu);border-color:var(--pu);color:#fff}button.dg{color:#f08aa0}:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
header input[type=search]{width:min(320px,100%)}label.ck{color:var(--mu);display:flex;gap:5px;align-items:center;cursor:pointer}label.ck input{accent-color:var(--pu)}
main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:24px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.pc{cursor:pointer}.pc b{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po{position:relative;aspect-ratio:2/3;background:linear-gradient(160deg,var(--g2),var(--g1));border:1px solid var(--line);border-radius:3px;overflow:hidden}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.po .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;color:#3a3d4d}
.po .tag{position:absolute;top:6px;left:6px;background:#000a;color:#fff;font-size:11px;padding:1px 7px;border-radius:3px}
.po .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--line)}
.have .bar{background:var(--te)}.want .bar{background:var(--bl)}.miss .bar{background:var(--pu)}.pc:hover .po,.pc:focus-visible .po{border-color:var(--pu)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500}tr:hover td{background:var(--g1)}
.empty{color:var(--mu);padding:48px 0;text-align:center}.mu{color:var(--mu)}h2{margin:0 0 8px}
.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mu);padding:9px 14px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--te)}
.f{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px 16px;max-width:640px;margin-bottom:18px;align-items:center}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9}
.md{background:var(--g1);border:1px solid var(--line);border-radius:6px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:22px}
.mh{display:grid;grid-template-columns:170px 1fr;gap:22px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.md .x{float:right}
a.l{color:var(--bl)}.msg{color:var(--te);margin-left:10px}
.tw{overflow-x:auto;max-width:100%}.pc{min-width:0}
.bd{position:absolute;left:0;right:0;bottom:5px;font-size:11px;padding:2px 7px;background:#000b;color:#fff}.have .bd{color:var(--te)}.want .bd{color:var(--bl)}.miss .bd{color:#c4a8ff}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.chips button{border-radius:16px;padding:5px 12px}.chips button.on{border-color:var(--te);color:var(--te)}
.note{background:var(--g1);border:1px solid var(--line);border-left:3px solid var(--bl);border-radius:4px;padding:9px 12px;margin:10px 0;color:#c9ccd8}
.sb{margin:6px 0;padding:6px 10px;border-radius:4px;background:var(--g2);border-left:3px solid var(--pu)}.sb.have{border-left-color:var(--te)}.sb.want{border-left-color:var(--bl)}
.rr{display:grid;grid-template-columns:minmax(0,1fr) 72px 110px 74px 52px 48px 100px;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);align-items:center}
.rr.rh{color:var(--mu);position:sticky;top:0;background:var(--g1);z-index:1}.rr.rh span{cursor:pointer;user-select:none}.rr.rh span:hover{color:var(--tx)}
.rr .t{overflow-wrap:anywhere}.rr .c{color:var(--mu)}.rsort{display:none}.rr2{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,92vw);background:var(--g2);border:1px solid var(--te);border-radius:6px;padding:11px 16px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}.toast.bad{border-color:#f08aa0}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;flex:none;flex-direction:row;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line);overscroll-behavior-x:contain;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
 .logo,nav hr{display:none}nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:12px 14px}nav a.on{border-bottom-color:var(--pu)}
 header{padding:10px 12px;gap:8px}header h1,header .sp{display:none}header input[type=search]{flex:1 1 100%;width:100%}
 input,select{font-size:16px}button{min-height:40px}main{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
 .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}.f{grid-template-columns:1fr}.mh{grid-template-columns:96px 1fr;gap:12px}
 .ov{padding:0;align-items:stretch}.md{width:100%;max-height:100dvh;height:100dvh;border-radius:0;padding:14px}main table{display:block;overflow-x:auto}
 .rr.rh{display:none}.rsort{display:block;margin:0 0 8px;width:100%}.rr{display:flex;flex-wrap:wrap;gap:2px 12px;padding:12px 4px}.rr .t{flex:1 1 100%}.rr .c{font-size:12px}.rr .b{margin-left:auto}}
</style></head><body>
<nav id="nav"></nav>
<div class="col"><header id="hd"></header><main id="m"></main></div>
<script>
const KEY=BOOKARR.apiKey,H={'X-Api-Key':KEY,'Content-Type':'application/json'};
const api=(p,o={})=>fetch('/api/v1/'+p,{headers:H,...o}).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.statusText);return r.json()});
const send=(p,m,b)=>api(p,{method:m,body:b?JSON.stringify(b):undefined});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAV=[['main','Library'],['comic','Comics'],['ebook','Ebooks'],['audiobook','Audiobooks'],['series','Series'],['calendar','Calendar'],'-',['wanted','Wanted'],['activity','Activity'],'-',['system','System'],['settings','Settings']];
const TITLE={main:'Library',comic:'Comics',ebook:'Ebooks',audiobook:'Audiobooks',series:'Series',calendar:'Calendar',wanted:'Wanted',activity:'Activity',system:'System',settings:'Settings'};
function toast(t,bad){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='toast show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',6000)}
let flt='all',RSORT={k:'score',d:-1},RFILT='all',STRICT=1;
let view='main',term='',sub='clients',types={comic:1,ebook:1,audiobook:1},REG=[];
const LOGO='<svg width="26" height="26" viewBox="0 0 26 26"><rect width="26" height="26" rx="6" fill="#8b5cf6"/><path d="M7 6h9a3 3 0 013 3v11H10a3 3 0 01-3-3z" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M11 11h5" stroke="#fff" stroke-width="2"/></svg>';
function chrome(){$('#nav').innerHTML=`<div class="logo">${LOGO}Bookarr</div>`+NAV.map(n=>n=='-'?'<hr>':`<a tabindex=0 class="${view==n[0]?'on':''}" data-k="${n[0]}">${n[1]}</a>`).join('');
 document.querySelectorAll('nav a').forEach(a=>{a.onclick=()=>{view=a.dataset.k;term='';go()};a.onkeydown=e=>{if(e.key=='Enter')a.click()}});
 $('#hd').innerHTML=`<h1>${TITLE[view]}</h1><span class="sp"></span><input type="search" id="q" placeholder="Search for a title, e.g. Deadpool" value="${esc(term)}">
 ${Object.keys(types).map(t=>`<label class="ck"><input type="checkbox" data-t="${t}" ${types[t]?'checked':''}>${t=='comic'?'Comics':t=='ebook'?'Ebooks':'Audiobooks'}</label>`).join('')}<button class="p" id="go">Search</button>`;
 const run=()=>{term=$('#q').value.trim();go()};$('#go').onclick=run;$('#q').onkeydown=e=>{if(e.key=='Enter')run()};
 document.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>types[c.dataset.t]=c.checked?1:0)}
const st=i=>i.status=='downloaded'?'have':i.status=='wanted'?'want':i.monitored?'miss':'off';
const BL={have:'Downloaded',want:'Downloading',miss:'Missing',off:'Unmonitored'};
function poster(i,src,lib){const k=REG.push(i)-1;let s=st(i),b=lib?(i._b||BL[s]):'';if(lib&&i.status=='downloaded'&&'file_size' in i&&i.file_size==null){s='miss';b='File missing'}
 return `<div class="pc ${lib?s:''}" tabindex=0 data-i="${k}"><div class="po">${src?`<img loading=lazy src="${esc(src)}" alt="" onerror="this.remove()">`:''}<span class="ph">${esc((i.title||'?').slice(0,2))}</span><span class="tag">${i.type}</span>${b?`<span class="bd">${esc(b)}</span>`:''}<i class="bar"></i></div><b>${esc(i.title)}</b><small>${esc([i.author||i.series,i.year].filter(Boolean).join(', '))}</small></div>`}
const FL={all:()=>1,have:i=>i.status=='downloaded',miss:i=>i.status=='missing',want:i=>i.status=='wanted'};
function drawLib(m,it){REG=[];const c=k=>it.filter(FL[k]).length,L=[['all','All'],['have','Downloaded'],['miss','Missing'],['want','Downloading']],v=it.filter(FL[flt]),sa=view=='comic'?it.filter(i=>i.type=='comic'&&!i.series_id).length:0;
 m.innerHTML=`<div class="chips">${L.map(([k,l])=>`<button class="${flt==k?'on':''}" data-f="${k}">${l} (${c(k)})</button>`).join('')}</div>`+(sa?`<div class="note">${sa} comic${sa>1?'s are':' is'} not part of a monitored series. Open one and tap <b>Find series</b> to track the whole run.</div>`:'')+
 (v.length?`<div class="grid">${v.map(i=>poster(i,'/api/v1/cover/'+i.id+'?apikey='+KEY,1)).join('')}</div>`:'<div class="empty">Nothing matches this filter.</div>');
 m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;drawLib(m,it)});bindPosters()}
function bindPosters(){document.querySelectorAll('.pc').forEach(p=>{p.onclick=()=>{const i=REG[p.dataset.i];i._s?seriesModal(i):modal(i)};p.onkeydown=e=>{if(e.key=='Enter')p.click()}})}
async function go(){chrome();REG=[];const m=$('#m');m.innerHTML='<div class="empty">Loading…</div>';
 try{if(view=='settings')return await settings(m);
  if(view=='series')return await seriesView(m);if(view=='calendar')return await calView(m);if(view=='system')return await systemView(m);
  if(view=='activity'){const [q,hs]=await Promise.all([api('queue'),api('history')]);
   m.innerHTML=`<div class="acts"><button class="p" id="chk">Check downloads now</button><span class="msg" id="msg"></span></div><h3>Queue</h3>`+(q.length?'<table><tr><th>Title<th>Status<th>Progress<th>Client</tr>'+q.map(x=>`<tr><td>${esc(x.title)}<td>${esc(x.status)}<td>${x.progress}%<td>${esc(x.client)}</tr>`).join('')+'</table>':'<div class="mu">Nothing downloading.</div>')+
   '<h3>History</h3>'+(hs.length?'<table><tr><th>Release<th>Type<th>Status<th>Date</tr>'+hs.map(x=>`<tr><td>${esc(x.title)}<td>${x.type}<td>${x.state=='sent'?'Downloading':x.state}${x.note?' ('+esc(x.note)+')':''}<td>${esc(x.created)}</tr>`).join('')+'</table>':'<div class="mu">No downloads yet.</div>');
   $('#chk').onclick=async()=>{$('#msg').textContent='Checking…';await send('command/checkdownloads','POST');go()};return}
  if(term){const r=await api('lookup?term='+encodeURIComponent(term)+'&types='+Object.keys(types).filter(k=>types[k]&&(view=='main'||view==k||view=='wanted')).join(','));
   m.innerHTML=(r.some(x=>x.type=='comic'&&x.provider!='comicvine')?'<div class="note">Comic results are limited without a ComicVine key. Add one in Settings &gt; Metadata to get real series and issue lists.</div>':'')+(r.length?`<div class="grid">${r.map(i=>poster(i,i.cover)).join('')}</div>`:'<div class="empty">No matches. Try fewer keywords, or check the metadata keys in Settings.</div>');return bindPosters()}
  const it=view=='wanted'?await api('wanted/missing'):await api('item'+(['comic','ebook','audiobook'].includes(view)?'?type='+view:''));
  if(!it.length){m.innerHTML='<div class="empty">Nothing here yet. Use the search box to find a title and add it, or scan your folders in Settings > Library.</div>';return}
  drawLib(m,it)
 }catch(e){m.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function stText(i){if(!i.id)return '';if(i.status=='downloaded')return i.file_size==null?'Marked as downloaded, but the file was not found on disk.':'Downloaded: '+(i.path||'').split('/').pop()+' ('+(i.file_size/1048576).toFixed(1)+' MB)';
 return i.status=='wanted'?'Download sent or in progress':i.monitored?'Missing. Bookarr searches for it automatically.':'Not monitored'}
function explain(i){if(i.provider=='comicvine')return '<p class="note"><b>Monitor series</b> adds every issue of this run, tracks new releases and downloads what is missing. Issues show up under Series and Comics.</p>';
 if(i.type=='comic')return '<p class="note">This adds one comic only. To follow the whole run, add your ComicVine key in Settings &gt; Metadata and search again.</p>';
 return '<p class="note"><b>Add this one only</b> tracks just this book. The series and author buttons track everything by them.</p>'}
function modal(i){const lib=!!i.id,d=document.createElement('div');d.className='ov';
 const src=lib?'/api/v1/cover/'+i.id+'?apikey='+KEY:i.cover,s=lib&&i.status=='downloaded'&&i.file_size!=null?'have':lib&&i.status=='wanted'?'want':'';
 d.innerHTML=`<div class="md"><button class="x">Close</button><div class="mh"><div class="po">${src?`<img src="${esc(src)}" alt="" onerror="this.remove()">`:''}<span class="ph">${esc((i.title||'?').slice(0,2))}</span></div>
 <div><h2>${esc(i.title)}</h2><p class="mu">${esc([i.type,i.author,i.series,i.publisher,i.year].filter(Boolean).join(', '))}</p>${lib?`<p class="sb ${s}">${esc(stText(i))}</p>`:''}<p>${esc(i.description||'No description yet.')}</p>${lib?'':explain(i)}
 <div class="acts">${lib?`<label class="ck"><input type="checkbox" id="mon" ${i.monitored?'checked':''}>Monitored</label><button class="p" id="rel">Search releases</button>${i.type=='comic'&&!i.series_id?'<button class="pu" id="findser">Find series</button>':''}<button id="ref">Refresh metadata</button>${libExtra(i)}<button class="dg" id="del">Delete</button>`
 :`${addButtons(i)}<button class="p" id="rel">Search releases</button>`}<span class="msg" id="msg"></span></div></div></div><div id="out"></div></div>`;
 document.body.appendChild(d);const q=x=>d.querySelector(x),close=()=>d.remove(),msg=t=>q('#msg').textContent=t;q('.x').onclick=close;d.onclick=e=>{if(e.target==d)close()};
 q('#rel').onclick=()=>releases(q('#out'),i);
 if(lib){q('#mon').onchange=e=>send('item/'+i.id,'PUT',{monitored:e.target.checked?1:0});wireLib(d,i,msg);
  q('#ref').onclick=async()=>{msg('Refreshing…');try{await send('item/'+i.id+'/refresh','POST');close();go()}catch(e){msg(e.message)}};
  q('#del').onclick=async()=>{if(confirm('Remove "'+i.title+'" from Bookarr? Files on disk are not deleted.')){await send('item/'+i.id+'?deleteFile='+(i.path&&confirm('Also delete the file from disk?')?1:0),'DELETE');close();go()}};
  if(q('#findser'))q('#findser').onclick=async()=>{const o=q('#out');o.innerHTML='<div class="empty">Looking up series…</div>';try{const r=(await api('lookup?term='+encodeURIComponent(i.series||i.title.replace(/\s*#?\d+\s*$/,''))+'&types=comic')).filter(x=>x.provider=='comicvine');
   o.innerHTML=r.length?'<h3>Pick the series to monitor</h3>'+r.map((x,n)=>`<div class="rr2"><div><b>${esc(x.title)}</b><div class="mu">${esc([x.publisher,x.year,x.issues?x.issues+' issues':''].filter(Boolean).join(', '))}</div></div><button class="pu" data-s="${n}">Monitor series</button></div>`).join(''):'<div class="empty">No series found. Check your ComicVine key in Settings &gt; Metadata.</div>';
   o.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{try{const x=await send('series','POST',r[b.dataset.s]);toast('Monitoring '+r[b.dataset.s].title+': '+x.added+' items added. Find it under Series.');close();go()}catch(e){toast(e.message,1)}})}catch(e){o.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}}
 else wireAdd(d,i,msg,close)}
async function releases(o,i){o.innerHTML='<div class="empty">Searching indexers…</div>';const sent=new Set(),term=(i.series&&i.num)?i.series+' '+i.num:i.title;let res;
 try{res=await api('search?term='+encodeURIComponent(term)+'&types='+i.type+'&strict='+STRICT)}catch(e){o.innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
 const H=[['title','Release'],['protocol','Type'],['indexer','Indexer'],['size','Size'],['seeders','Seeds'],['age','Age']],all=res.results;
 const draw=()=>{const k=RSORT.k,dv=RSORT.d,cnt=p=>all.filter(x=>x.protocol==p).length;
  const r=all.filter(x=>RFILT=='all'||x.protocol==RFILT).sort((a,b)=>{let x=a[k],y=b[k];if(typeof x=='string'||typeof y=='string'){x=(x||'').toLowerCase();y=(y||'').toLowerCase()}else{x=x??-1;y=y??-1}return(x>y?1:x<y?-1:0)*dv});
  o.innerHTML=`<div class="chips"><button data-p="all" class="${RFILT=='all'?'on':''}">All (${all.length})</button><button data-p="torrent" class="${RFILT=='torrent'?'on':''}">Torrents (${cnt('torrent')})</button><button data-p="usenet" class="${RFILT=='usenet'?'on':''}">Usenet (${cnt('usenet')})</button>
  <label class="ck"><input type="checkbox" id="strict" ${STRICT?'checked':''}>Exact matches only${res.hidden?' ('+res.hidden+' hidden)':''}</label></div>
  <select class="rsort" id="rs"><option value="score">Best match</option>${H.map(([c,l])=>`<option value="${c}" ${RSORT.k==c?'selected':''}>Sort by ${l.toLowerCase()}</option>`).join('')}</select>
  <div class="rh-wrap"><div class="rr rh">${H.map(([c,l])=>`<span data-k="${c}">${l}${RSORT.k==c?(RSORT.d>0?' ▲':' ▼'):''}</span>`).join('')}<span></span></div>
  ${r.length?r.map(x=>{const n=all.indexOf(x);return `<div class="rr"><div class="t">${esc(x.title)}</div><span class="c">${x.protocol=='usenet'?'Usenet':'Torrent'}</span><span class="c">${esc(x.indexer)}</span><span class="c">${(x.size/1048576).toFixed(0)} MB</span><span class="c">${x.protocol=='usenet'?'':(x.seeders??0)+' seeds'}</span><span class="c">${x.age!=null?x.age+'d':''}</span><span class="b"><button data-g="${n}" ${sent.has(n)?'disabled':''}>${sent.has(n)?'Sent ✓':'Download'}</button></span></div>`}).join(''):'<div class="empty">No releases match. Untick "Exact matches only" to see everything the indexers returned.</div>'}</div>`;
  o.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{RFILT=b.dataset.p;draw()});
  o.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{RSORT=RSORT.k==c.dataset.k?{k:RSORT.k,d:-RSORT.d}:{k:c.dataset.k,d:['title','protocol','indexer'].includes(c.dataset.k)?1:-1};draw()});
  o.querySelector('#rs').onchange=e=>{RSORT={k:e.target.value,d:['title','protocol','indexer'].includes(e.target.value)?1:-1};draw()};
  o.querySelector('#strict').onchange=e=>{STRICT=e.target.checked?1:0;releases(o,i)};
  o.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.g,x=all[n];b.disabled=true;b.textContent='Sending…';
   try{const r=await send('release','POST',{...x,item_id:i.id});sent.add(n);b.textContent='Sent ✓';toast('Sent to '+r.client+': '+x.title)}catch(e){b.disabled=false;b.textContent='Download';toast('Could not send: '+e.message,1)}})};
 draw()}
const FORMS={general:[['logLevel','Log level']],indexer:[['prowlarrUrl','Prowlarr URL'],['prowlarrKey','Prowlarr API key']],
 library:[['comic','Comics folder'],['ebook','Ebooks folder'],['audiobook','Audiobooks folder'],['downloads','Downloads folder']],
 media:[['autoSearchMinutes','Search every (minutes)'],['minSeeders','Minimum seeders'],['importMode','Import mode (auto, move, copy, hardlink)'],['remotePath','Download path as the client sees it'],['localPath','Same folder as Bookarr sees it']],
 metadata:[['comicvineKey','ComicVine API key'],['googleBooksKey','Google Books API key (optional)'],['audibleRegion','Audible region (com, co.uk, de...)'],['writeTags','Write tags into files after import (1 or 0)']],
 quality:[['comic','Comic formats, best first'],['ebook','Ebook formats, best first'],['audiobook','Audiobook formats, best first'],['comicMaxMB','Comic max size (MB, 0 = no limit)'],['ebookMaxMB','Ebook max size (MB)'],['audiobookMaxMB','Audiobook max size (MB)'],['requirePreferred','Only accept preferred formats (1 or 0)']],
 notifications:[['onGrab','Notify on grab (1 or 0)'],['onImport','Notify on import (1 or 0)'],['onFail','Notify on failure (1 or 0)'],['discordWebhook','Discord webhook URL'],['pushoverUser','Pushover user key'],['pushoverToken','Pushover app token'],['telegramToken','Telegram bot token'],['telegramChat','Telegram chat ID'],['webhookUrl','Generic webhook URL']],
 email:[['smtpHost','SMTP server'],['smtpPort','SMTP port'],['user','SMTP username'],['password','SMTP password'],['from','From address'],['kindleAddress','Send-to-Kindle address']],
 security:[['authMode','Authentication (none or basic)'],['username','Username'],['password','Password']]};
const SUBS=[['clients','Download clients'],['indexer','Indexers'],['quality','Quality'],['metadata','Metadata'],['notifications','Notifications'],['email','Email'],['library','Library'],['media','Media'],['security','Security'],['devices','Reader devices'],['general','General'],['logs','Logs']];
async function settings(m){m.innerHTML=`<div class="tabs">${SUBS.map(([k,l])=>`<button class="${sub==k?'on':''}" data-s="${k}">${l}</button>`).join('')}</div><div id="out"></div>`;
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;go()});const o=$('#out');
 if(sub=='logs'){const l=await api('log');o.innerHTML='<table>'+l.map(x=>`<tr><td>${esc(x.time)}<td>${x.level}<td>${esc(x.message)}</tr>`).join('')+'</table>';return}
 if(sub=='devices')return await devicesView(o);
 if(sub=='clients'){const c=await api('downloadclient');o.innerHTML=(c.length?'<div class="tw"><table>'+c.map(x=>`<tr><td>${esc(x.name)}<td>${x.kind}<td>${esc(x.url)}<td id="cs${x.id}" class="mu">Checking…<td><button data-t="${x.id}">Test</button> <button class="dg" data-d="${x.id}">Remove</button></tr>`).join('')+'</table></div>':'<div class="empty">No download clients yet.</div>')+
  `<h3>Add download client</h3><div class="f"><span>Name</span><input id=n><span>Type</span><select id=k><option>sabnzbd<option>qbittorrent</select><span>URL</span><input id=u placeholder="http://your-server-ip:8080" inputmode=url autocapitalize=off><span>API key (SABnzbd)</span><input id=a autocapitalize=off><span>Username (qBittorrent)</span><input id=us autocapitalize=off><span>Password (qBittorrent)</span><input id=pw type=password><span>Category</span><input id=c placeholder="books" autocapitalize=off></div>
  <p class="mu">Category must match the category in SABnzbd or qBittorrent (blank means "books"). Bookarr checks the connection as soon as you add the client.</p><button class="p" id=add>Add client</button> <button id=tst>Test first</button><div id="res"></div>`;
  const show=(el,r)=>{el.className=r.ok?'':'';el.style.color=r.ok?'var(--te)':'#f08aa0';el.textContent=(r.ok?'✓ ':'✗ ')+r.message};
  c.forEach(x=>api('downloadclient/'+x.id+'/test',{method:'POST'}).then(r=>show($('#cs'+x.id),r)).catch(e=>show($('#cs'+x.id),{ok:0,message:e.message})));
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const el=$('#cs'+b.dataset.t);el.style.color='';el.textContent='Checking…';api('downloadclient/'+b.dataset.t+'/test',{method:'POST'}).then(r=>show(el,r))});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await send('downloadclient/'+b.dataset.d,'DELETE');go()});
  const body=()=>({name:$('#n').value,kind:$('#k').value,url:$('#u').value,apikey:$('#a').value,username:$('#us').value,password:$('#pw').value,category:$('#c').value});
  $('#tst').onclick=async()=>{$('#res').textContent='Checking…';$('#res').style.color='';try{show($('#res'),await send('downloadclient/test','POST',body()))}catch(e){show($('#res'),{ok:0,message:e.message})}};
  $('#add').onclick=async()=>{try{const r=await send('downloadclient','POST',body());toast(r.ok?'Added. '+r.message:'Added, but the connection check failed: '+r.message,!r.ok);go()}catch(e){toast(e.message,1)}};return}
 const v=await api('config/'+sub);
 o.innerHTML=(sub=='library'?'<p class="note">Downloads stay in your downloads folder while they run. When a download finishes, Bookarr moves it into the matching folder below (Comics, Ebooks or Audiobooks inside your Books share) and sorts it by series or author. Set the same category in your download clients.</p>':'')+(sub=='general'?`<div class="f"><span>API key</span><input readonly value="${v.apiKey}"><span>OPDS catalog</span><input readonly value="${location.origin}/opds"></div>`:'')+`<div class="f">${(FORMS[sub]||[]).map(([k,l])=>`<span>${l}</span><input data-k="${k}" value="${esc(v[k])}">`).join('')}</div><button class="p" id=save>Save changes</button>
 ${sub=='library'?' <button id=scan>Scan library</button>':''}${sub=='metadata'?' <button id=rm>Refresh missing metadata</button>':''}${sub=='notifications'?' <button id=tn>Send test</button>':''}<span class="msg" id=msg></span>`;
 $('#save').onclick=async()=>{const b={};document.querySelectorAll('[data-k]').forEach(i=>b[i.dataset.k]=isNaN(i.value)||i.value===''?i.value:+i.value);await send('config/'+sub,'PUT',b);$('#msg').textContent='Saved'};
 if($('#scan'))$('#scan').onclick=async()=>{const r=await send('library/scan','POST');$('#msg').textContent='Added '+r.added+' items'};
 if($('#tn'))$('#tn').onclick=async()=>{await $('#save').onclick();await send('notification/test','POST');$('#msg').textContent='Test sent'};
 if($('#rm'))$('#rm').onclick=async()=>{$('#msg').textContent='Working…';const r=await send('metadata/refresh','POST');$('#msg').textContent='Updated '+r.updated+' of '+r.checked}}
document.addEventListener('keydown',e=>{if(e.key=='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q')?.focus()}});
function addButtons(i){let b='';
 if(i.provider=='comicvine')return '<button class="pu" id="mon-s">Monitor series (all issues)</button>';
 b+='<button class="pu" id="add">Add this one only</button><button id="addgo">Add and search</button>';
 if(i.type=='audiobook'&&i.series)b+='<button id="mon-s">Monitor whole series</button>';
 if(i.type=='ebook'&&i.author)b+='<button id="mon-a">Monitor author</button>';return b}
function wireAdd(d,i,msg,close){const q=s=>d.querySelector(s),say=(t,bad)=>{msg(t);toast(t,bad)};
 const addSeries=async x=>{msg('Adding…');try{const r=await send('series','POST',{...i,...x});say('Monitoring '+(x.title||i.title)+': '+r.added+' items added. Open Series to see them.')}catch(e){say(e.message,1)}};
 if(q('#add'))q('#add').onclick=async()=>{try{await send('item','POST',i);say('Added "'+i.title+'" to your library');q('#add').disabled=true}catch(e){say(e.message,1)}};
 if(q('#addgo'))q('#addgo').onclick=async()=>{msg('Adding and searching…');try{const r=await send('item','POST',i);const g=await send('item/'+r.id+'/search','POST');say('Added and sent to your download client: '+g.release)}catch(e){say(e.message,1)}};
 if(q('#mon-s'))q('#mon-s').onclick=()=>addSeries(i.provider=='comicvine'?{}:{title:i.series,ext_id:i.series});
 if(q('#mon-a'))q('#mon-a').onclick=()=>addSeries({title:i.author,provider:'author',ext_id:i.author,cover:null,description:''})}
const libExtra=i=>(i.path&&i.type=='ebook'?'<button id="kindle">Send to Kindle</button>':'')+(i.path?'<button id="tags">Write tags</button>':'');
function wireLib(d,i,msg){const q=s=>d.querySelector(s);
 if(q('#kindle'))q('#kindle').onclick=async()=>{msg('Sending…');try{await send('item/'+i.id+'/send','POST');msg('Sent to Kindle')}catch(e){msg(e.message)}};
 if(q('#tags'))q('#tags').onclick=async()=>{try{await send('item/'+i.id+'/tags','POST');msg('Tags written')}catch(e){msg(e.message)}}}
async function seriesView(m){const s=await api('series');
 m.innerHTML=s.length?`<div class="grid">${s.map(x=>poster({...x,_s:1,status:x.total&&x.have>=x.total?'downloaded':x.have?'wanted':'missing',author:x.have+' of '+x.total+' downloaded'},x.cover,1)).join('')}</div>`:'<div class="empty">No series yet. Search for a comic, open the result and choose <b>Monitor series</b>. Bookarr adds every issue and downloads what is missing.</div>';bindPosters()}
async function seriesModal(s){const {series:sr,items}=await api('series/'+s.id),d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class="md"><button class="x">Close</button><div class="mh"><div class="po">${sr.cover?`<img src="${esc(sr.cover)}" alt="" onerror="this.remove()">`:''}<span class="ph">${esc(sr.title.slice(0,2))}</span></div><div><h2>${esc(sr.title)}</h2><p class="mu">${esc([sr.type,sr.publisher,sr.year,sr.have+' of '+sr.total+' downloaded'].filter(Boolean).join(', '))}</p><p>${esc(sr.description||'')}</p>
 <div class="acts"><label class="ck"><input type="checkbox" id="sm" ${sr.monitored?'checked':''}>Monitored</label><button class="p" id="ss">Search missing</button><button id="sf">Refresh issues</button><button class="dg" id="sd">Remove series</button><span class="msg" id="msg"></span></div></div></div>
 <table><tr><th>#<th>Title<th>Release date<th>Status</tr>${items.map(x=>`<tr><td>${esc(x.num||'')}<td>${esc(x.title)}<td>${esc(x.release_date||'')}<td>${x.status}</tr>`).join('')}</table></div>`;
 document.body.appendChild(d);const q=x=>d.querySelector(x),close=()=>d.remove(),msg=t=>q('#msg').textContent=t;q('.x').onclick=close;d.onclick=e=>e.target==d&&close();
 q('#sm').onchange=e=>send('series/'+sr.id,'PUT',{monitored:e.target.checked?1:0});
 q('#ss').onclick=async()=>{msg('Searching…');try{const r=await send('series/'+sr.id+'/search','POST');msg('Sent '+r.sent+' releases')}catch(e){msg(e.message)}};
 q('#sf').onclick=async()=>{msg('Refreshing…');try{const r=await send('series/'+sr.id+'/refresh','POST');msg(r.added+' new items');}catch(e){msg(e.message)}};
 q('#sd').onclick=async()=>{if(confirm('Remove "'+sr.title+'"? Downloaded files are kept.')){await send('series/'+sr.id,'DELETE');close();go()}}}
async function calView(m){const d=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),it=await api(`calendar?start=${d(-14)}&end=${d(90)}`),g={};
 it.forEach(x=>(g[x.release_date]??=[]).push(x));
 m.innerHTML=Object.keys(g).length?Object.keys(g).sort().map(k=>`<h3 class="${k>d(0)?'':'mu'}">${k}</h3><table>${g[k].map(x=>`<tr><td>${esc(x.title)}<td>${x.type}<td>${x.status}</tr>`).join('')}</table>`).join(''):'<div class="empty">No dated releases yet. Monitor a comic series to see upcoming issues here.</div>'}
const fmt=b=>b>1e12?(b/1e12).toFixed(1)+' TB':(b/1e9).toFixed(0)+' GB';
async function systemView(m){const [i,h,du,bk]=await Promise.all([api('system/info'),api('health'),api('duplicates'),api('system/backup')]);
 m.innerHTML=`<h3>Health</h3><table>${h.map(x=>`<tr><td style="width:70px;color:${x.ok?'var(--te)':'var(--pu)'}">${x.ok?'OK':'Check'}<td>${esc(x.name)}<td class="mu">${esc(x.message)}</tr>`).join('')}</table>
 <h3>Disk space</h3><table>${i.disks.map(x=>`<tr><td>${esc(x.name)}<td class="mu">${esc(x.path)}<td>${fmt(x.free)} free of ${fmt(x.total)}</tr>`).join('')}</table>
 <h3>About</h3><p class="mu">Bookarr ${i.version}, running for ${i.uptime}. ${i.counts.comic} comics, ${i.counts.ebook} ebooks, ${i.counts.audiobook} audiobooks.</p>
 <h3>Backups</h3><div class="acts"><button class="p" id="bk">Create backup</button></div><table>${bk.map(b=>`<tr><td>${esc(b.name)}<td>${(b.size/1024).toFixed(0)} KB<td><a class="l" href="/api/v1/system/backup/${encodeURIComponent(b.name)}?apikey=${KEY}">Download</a></tr>`).join('')}</table>
 <h3>Duplicates</h3>`+(du.length?du.map(g=>`<table>${g.map(x=>`<tr><td>${esc(x.title)}<td class="mu">${esc(x.path)}<td><button class="dg" data-x="${x.id}">Delete file</button></tr>`).join('')}</table><br>`).join(''):'<div class="mu">No duplicates found.</div>');
 $('#bk').onclick=async()=>{await send('system/backup','POST');go()};
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this file from disk and remove it from Bookarr?')){await send('item/'+b.dataset.x+'?deleteFile=1','DELETE');go()}})}
async function devicesView(o){const d=await api('device');
 o.innerHTML=`<p class="mu">Give each reading app its own key so you can revoke one without breaking the others.</p>`+(d.length?'<table><tr><th>Name<th>Catalog address<th>Last used<th></tr>'+d.map(x=>`<tr><td>${esc(x.name)}<td class="mu">${location.origin}/opds?apikey=${x.key}<td class="mu">${esc(x.last_used||'never')}<td><button class="dg" data-r="${x.id}">Revoke</button></tr>`).join('')+'</table>':'<div class="empty">No devices yet.</div>')+`<h3>Add device</h3><div class="f"><span>Name</span><input id=dn placeholder="Moon+ Reader on phone"></div><button class="p" id=da>Create key</button>`;
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await send('device/'+b.dataset.r,'DELETE');go()});
 $('#da').onclick=async()=>{await send('device','POST',{name:$('#dn').value});go()}}
go();
</script></body></html>
