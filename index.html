<style>

.dgl{max-width:480px;height:auto!important;align-self:center}h3{margin:24px 0 8px}
@media(max-width:760px){.ip{grid-template-columns:104px minmax(0,1fr);gap:12px}}
.mob{display:none}nav a.sub{padding:6px 18px 6px 34px;font-size:13px}nav a.sub:before{content:"└ ";color:#4a4d5c}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar2 .chips{margin:0}.bar2 .sp{flex:1}.bar2 input{width:min(220px,100%)}
.syn{white-space:pre-line;max-width:780px}.syn.cut{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.dt{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;max-width:780px;margin:14px 0}.dt dt{color:var(--mu)}.dt dd{margin:0;overflow-wrap:anywhere}
.rr .tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 0;align-items:center}.rr .tags .lk{padding:0 8px;font-size:13px}.pill.pk{border-color:var(--te);color:var(--te)}.pill.wr{border-color:#d9a54a;color:#e8bd6a}.rr.pick{background:#2dd4bf0d}.peek{font-size:13px;margin-top:4px}.peek table td{padding:3px 8px}.pb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 4px}.pb i{display:block;height:100%;background:var(--bl);border-radius:4px;transition:width .5s}
.dlbox{background:var(--g2);border-radius:4px;padding:8px 12px;margin:-4px 0 12px}.bad{color:#f08aa0;display:block;margin-top:2px}.pill{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 9px;margin:0 4px 4px 0;font-size:12px;color:#c9ccd8}
.help{color:var(--mu);font-size:13px;margin:8px 0 0;max-width:640px}.help b{color:var(--tx)}
button.lk{background:none;border:0;color:var(--bl);padding:7px 4px;text-decoration:underline}
.cv{display:flex;gap:6px;align-items:center;margin-top:4px}.cv select{padding:4px 6px}.cv button{padding:4px 10px}
td.sort,th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--tx)}.x1{padding:2px 8px;color:var(--mu)}
.mode label{display:block;margin:4px 0;cursor:pointer}.mode input{accent-color:var(--pu);margin-right:6px}

</style></head><body>
<nav id="nav"></nav>
<div class="col"><header id="hd"></header><main id="m"></main></div>
<script>
const KEY=BOOKARR.apiKey,H={'X-Api-Key':KEY,'Content-Type':'application/json'};
const api=(p,o={})=>fetch('/api/v1/'+p,{headers:H,...o}).then(async r=>{if(!r.ok){const d=(await r.json().catch(()=>({}))).detail;throw new Error((typeof d=='string'?d:d?JSON.stringify(d):'')||('Bookarr could not finish that (error '+r.status+(r.statusText?' '+r.statusText:'')+'). Check Settings > Logs for details.'))}return r.json()},e=>{throw new Error(e.message&&!/fetch/i.test(e.message)?e.message:'Could not reach Bookarr. Is the container running?')});
const send=(p,m,b)=>api(p,{method:m,body:b?JSON.stringify(b):undefined});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get:(k,d)=>{try{return localStorage.getItem('bookarr.'+k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('bookarr.'+k,v)}catch(e){}}};
// side menu: sub-entries hold the series/authors you follow for each type
const NAV=[['main','Library'],['comic','Comics'],['comic-follow','<span class="mob">Comic </span>Series',1],['ebook','Ebooks'],['ebook-follow','<span class="mob">Ebook </span>Authors',1],['audiobook','Audiobooks'],['audiobook-follow','<span class="mob">Audio </span>Authors &amp; series',1],['calendar','Calendar'],'-',['wanted','Wanted'],['activity','Activity'],'-',['system','System'],['settings','Settings']];
const TITLE={main:'Library',comic:'Comics','comic-follow':'Comic series',ebook:'Ebooks','ebook-follow':'Ebook authors',audiobook:'Audiobooks','audiobook-follow':'Audiobook authors & series',calendar:'Calendar',wanted:'Wanted',activity:'Activity',system:'System',settings:'Settings'};
const TN={comic:'Comics',ebook:'Ebooks',audiobook:'Audiobooks'},T1={comic:'comic',ebook:'ebook',audiobook:'audiobook'};
function toast(t,bad){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='toast show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',7000)}
let flt='all',RSORT={k:'score',d:-1},RFILT='all',STRICT=1,HFILT='all';
let view='main',term='',sub='clients',types={comic:1,ebook:1,audiobook:1},REG=[];
const LOGO='<svg width="26" height="26" viewBox="0 0 26 26"><rect width="26" height="26" rx="6" fill="#8b5cf6"/><path d="M7 6h9a3 3 0 013 3v11H10a3 3 0 01-3-3z" fill="none" stroke="#2dd4bf" stroke-width="2"/><path d="M11 11h5" stroke="#fff" stroke-width="2"/></svg>';
const baseType=v=>v.split('-')[0];
const hsh=t=>{let h=0;for(const c of String(t||''))h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(36)};
const coverUrl=i=>'/api/v1/cover/'+i.id+'?apikey='+KEY+'&v='+hsh((i.cover||'')+'|'+(i.path||''));
const KN={sabnzbd:'SABnzbd',qbittorrent:'qBittorrent'};
const pbar=p=>`<div class="pb"><i style="width:${Math.max(2,Math.min(100,p||0))}%"></i></div>`;
let LPOLL=0;
function chrome(){$('#nav').innerHTML=`<div class="logo">${LOGO}Bookarr</div>`+NAV.map(n=>n=='-'?'<hr>':`<a tabindex=0 class="${view==n[0]?'on':''} ${n[2]?'sub':''}" data-k="${n[0]}">${n[1]}</a>`).join('');
 document.querySelectorAll('nav a').forEach(a=>{a.onclick=()=>{view=a.dataset.k;term='';history.replaceState(null,'',location.pathname);go()};a.onkeydown=e=>{if(e.key=='Enter')a.click()}});
 $('#hd').innerHTML=`<h1>${TITLE[view]||'Bookarr'}</h1><span class="sp"></span><input type="search" id="q" placeholder="Find a book, comic or audiobook to add" value="${esc(term)}">
 ${Object.keys(types).map(t=>`<label class="ck"><input type="checkbox" data-t="${t}" ${types[t]?'checked':''}>${TN[t]}</label>`).join('')}<button class="p" id="go">Search</button>`;
 const run=()=>{term=$('#q').value.trim();history.replaceState(null,'',location.pathname);go()};$('#go').onclick=run;$('#q').onkeydown=e=>{if(e.key=='Enter')run()};
 document.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>types[c.dataset.t]=c.checked?1:0)}
const st=i=>i.status=='downloaded'?'have':i.status=='wanted'?'want':i.monitored?'miss':'off';
const BL={have:'Downloaded',want:'Downloading',miss:'Missing',off:'Not monitored'};
function poster(i,src,lib){const k=REG.push(i)-1;let s=st(i),b=lib?(i._b||BL[s]):'';if(lib&&!i._s&&i.status=='downloaded'&&i.path&&i.file_size!=null)b='Downloaded, '+i.path.split('.').pop().toUpperCase();if(lib&&!i._s&&i.status=='downloaded'&&'file_size' in i&&i.file_size==null){s='miss';b='File missing'}
 return `<div class="pc ${lib?s:''}" tabindex=0 data-i="${k}"><div class="po">${src?`<img loading=lazy src="${esc(src)}" alt="" onerror="this.remove()">`:''}<span class="ph">${esc((i.title||'?').slice(0,2))}</span><span class="tag">${esc(i._tag||i.type)}</span>${b?`<span class="bd">${esc(b)}</span>`:''}<i class="bar"></i></div><b>${esc(i.title)}</b><small>${esc(i._sub||[i.author||i.series,i.year].filter(Boolean).join(', '))}</small></div>`}
// ---------- library grid: filter chips, quick filter, sorting ----------
const FL={all:()=>1,have:i=>i.status=='downloaded',miss:i=>i.status=='missing'&&i.monitored,want:i=>i.status=='wanted',off:i=>!i.monitored&&i.status!='downloaded'};
const SORTS=[['added','Recently added'],['title','Title A–Z'],['author','Author A–Z'],['series','Series order'],['year','Newest year first'],['release','Release date'],['size','Biggest files'],['status','Status']];
const cmpS=(a,b)=>String(a||'￿').localeCompare(String(b||'￿'),undefined,{numeric:true,sensitivity:'base'});
const bare=t=>String(t||'').replace(/^(the|a|an)\s+/i,'');
const STO={downloaded:0,wanted:1,missing:2};
const SORTF={added:(a,b)=>cmpS(b.added,a.added),title:(a,b)=>cmpS(bare(a.title),bare(b.title)),author:(a,b)=>cmpS(a.author,b.author)||cmpS(a.series,b.series)||(parseFloat(a.num)||0)-(parseFloat(b.num)||0)||cmpS(bare(a.title),bare(b.title)),
 series:(a,b)=>cmpS(a.series||a.title,b.series||b.title)||(parseFloat(a.num)||0)-(parseFloat(b.num)||0)||cmpS(a.title,b.title),year:(a,b)=>(b.year||0)-(a.year||0)||cmpS(a.title,b.title),
 release:(a,b)=>cmpS(b.release_date||'',a.release_date||''),size:(a,b)=>(b.file_size||0)-(a.file_size||0),status:(a,b)=>(STO[a.status]??3)-(STO[b.status]??3)||cmpS(a.title,b.title)};
function drawLib(m,it){REG=[];const sk=store.get('sort.'+view,view=='wanted'?'release':'added'),qf=(drawLib.q||'').toLowerCase();
 const c=k=>it.filter(FL[k]).length,L=[['all','All'],['have','Downloaded'],['want','Downloading'],['miss','Missing'],['off','Not monitored']];
 const v=it.filter(FL[flt]).filter(i=>!qf||[i.title,i.author,i.series,i.publisher].join(' ').toLowerCase().includes(qf)).sort(SORTF[sk]||SORTF.added);
 const sa=view=='comic'?it.filter(i=>i.type=='comic'&&!i.series_id).length:0;
 m.innerHTML=`<div class="bar2"><div class="chips">${L.map(([k,l])=>`<button class="${flt==k?'on':''}" data-f="${k}">${l} (${c(k)})</button>`).join('')}</div><span class="sp"></span>
 <input type="search" id="lf" placeholder="Filter this list" value="${esc(drawLib.q||'')}"><select id="ls" aria-label="Sort">${SORTS.map(([k,l])=>`<option value="${k}" ${sk==k?'selected':''}>Sort: ${l}</option>`).join('')}</select></div>`+
 (sa?`<div class="note">${sa} comic${sa>1?'s are':' is'} not part of a followed series. Open one and tap <b>Find series</b> to track the whole run.</div>`:'')+
 (v.length?`<div class="grid">${v.map(i=>poster(i,coverUrl(i),1)).join('')}</div>`:'<div class="empty">Nothing matches this filter.</div>');
 m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;drawLib(m,it)});
 $('#ls').onchange=e=>{store.set('sort.'+view,e.target.value);drawLib(m,it)};
 libProgress(m,it);$('#lf').oninput=e=>{drawLib.q=e.target.value;clearTimeout(drawLib.t);drawLib.t=setTimeout(()=>{const p=e.target.selectionStart;drawLib(m,it);const f=$('#lf');f.focus();f.setSelectionRange(p,p)},250)};bindPosters()}
async function libProgress(m,it){clearTimeout(LPOLL);if(!it.some(i=>i.status=='wanted'))return;const v=view;let q;try{q=await api('queue')}catch(e){return}
 if(view!=v||!m.isConnected||term)return;const by={};q.forEach(x=>{if(x.item_id)by[x.item_id]=x});
 m.querySelectorAll('.pc').forEach(p=>{const i=REG[p.dataset.i],x=i&&by[i.id];if(!x)return;const b=p.querySelector('.bd'),bar=p.querySelector('.bar');
  if(b)b.textContent=x.problem?'Needs attention':(x.progress!=null&&x.progress<100?'Downloading '+Math.floor(x.progress)+'%':x.status.split(',')[0]);
  if(bar&&x.progress!=null)bar.style.background=`linear-gradient(90deg,var(--bl) ${x.progress}%,var(--line) ${x.progress}%)`});
 if(q.length)LPOLL=setTimeout(()=>libProgress(m,it),8000)}
function bindPosters(){document.querySelectorAll('.pc').forEach(p=>{p.onclick=()=>{const i=REG[p.dataset.i];i._s?location.hash='#/series/'+i.id:i.id?location.hash='#/item/'+i.id:modal(i)};p.onkeydown=e=>{if(e.key=='Enter')p.click()}})}
async function go(){clearTimeout(LPOLL);clearTimeout(POLL);chrome();REG=[];const m=$('#m');m.innerHTML='<div class="empty">Loading…</div>';
 try{if(view=='settings')return await settings(m);
  if(term){const tv=baseType(view),r=await api('lookup?term='+encodeURIComponent(term)+'&types='+Object.keys(types).filter(k=>types[k]&&(!T1[tv]||tv==k)).join(','));
   m.innerHTML=`<div class="bar2"><span class="mu">Results for <b style="color:var(--tx)">${esc(term)}</b>. Tap a title to see its details and add it.</span><span class="sp"></span><button id="cls">✕ Close search</button></div>`+(r.some(x=>x.type=='comic'&&x.provider!='comicvine')?'<div class="note">Comic results are limited without a ComicVine key. Add one in Settings &gt; Metadata to get real series and issue lists.</div>':'')+(r.length?`<div class="grid">${r.map(i=>poster(i,i.cover)).join('')}</div>`:'<div class="empty">No matches. Try fewer keywords, or check the metadata keys in Settings.</div>');$('#cls').onclick=closeSearch;return bindPosters()}
  if(view.endsWith('-follow'))return await followView(m,baseType(view));
  if(view=='calendar')return await calView(m);if(view=='system')return await systemView(m);if(view=='activity')return await activityView(m);
  const it=view=='wanted'?await api('wanted/missing'):await api('item'+(T1[view]?'?type='+view:''));
  if(!it.length){m.innerHTML=`<div class="empty">${view=='wanted'?'Nothing missing. Everything you monitor is downloaded.':'Nothing here yet. Use the search box at the top to find a title and add it, or scan your folders in Settings &gt; Library.'}</div>`;return}
  drawLib(m,it)
 }catch(e){m.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
// ---------- activity: queue + history with clearing ----------
async function activityView(m){const [q,hs]=await Promise.all([api('queue'),api('history')]);clearTimeout(LPOLL);if(q.length)LPOLL=setTimeout(()=>{if(view=='activity'&&!location.hash.startsWith('#/')&&$('#chk'))activityView(m)},6000);
 const HF={all:()=>1,sent:x=>x.state=='sent',imported:x=>x.state=='imported',failed:x=>x.state=='failed'},hv=hs.filter(HF[HFILT]);

 ${au?`<h3>What should download automatically?</h3><div class="mode">${[['future','Only new books that come out from now on'],['all','Every book I do not have yet (the whole back catalogue)'],['none','Nothing. Just list them; I will tick the ones I want']].map(([k,l])=>`<label><input type="radio" name="mm" value="${k}" ${(sr.mon_mode||'future')==k?'checked':''}>${l}</label>`).join('')}</div>`:`<label class="ck"><input type="checkbox" id="sm" ${sr.monitored?'checked':''}>Monitored (download missing issues automatically)</label>`}
 <div class="acts"><button class="p" id="ss">Search wanted now</button><button id="sf">${au?'Check for new books':'Refresh issues'}</button><button class="dg" id="sd">${au?'Stop following':'Remove series'}</button></div></div></div>
 <p class="help">Tick <b>Want</b> on any title to have Bookarr download it, untick to skip it.</p>
 <div class="tw"><table><tr><th>Want</th>${SCOL.filter(c=>c[0]!='num'||hasNum).map(([k,l])=>`<th class="sort" data-sk="${k}">${l}${SSORT.k==k?(SSORT.d>0?' ▲':' ▼'):''}</th>`).join('')}<th>File<th></tr>${its.map(x=>{const f=x.path&&x.file_size!=null;return `<tr><td><input type="checkbox" data-w="${x.id}" ${x.monitored||f?'checked':''} ${f?'disabled':''} style="accent-color:var(--pu)">${hasNum?`<td>${esc(x.num||'')}`:''}<td><a class="l" href="#/item/${x.id}">${esc(x.title)}</a><td>${esc(x.release_date||'')}<td>${f?'Downloaded':x.status=='wanted'?'Downloading':x.monitored?'Wanted':'Skipped'}<td>${f?esc(x.path.split('.').pop().toUpperCase())+', '+mb(x.file_size):'-'}<td>${f?`<button class="dg" data-df="${x.id}">Delete file</button>`:''}</tr>`}).join('')}</table></div>`;
 const q=x=>m.querySelector(x);
 m.querySelectorAll('[data-sk]').forEach(h=>h.onclick=()=>{SSORT=SSORT.k==h.dataset.sk?{k:SSORT.k,d:-SSORT.d}:{k:h.dataset.sk,d:h.dataset.sk=='release_date'?-1:1};draw()});
 m.querySelectorAll('[data-w]').forEach(c=>c.onchange=async()=>{await send('item/'+c.dataset.w,'PUT',{monitored:c.checked?1:0});const x=d.items.find(y=>y.id==c.dataset.w);x.monitored=c.checked?1:0;draw()});
 m.querySelectorAll('[name=mm]').forEach(r=>r.onchange=async()=>{await send('series/'+sr.id,'PUT',{mon_mode:r.value});toast(r.value=='all'?'Every missing book is now wanted. Tap "Search wanted now" to start.':r.value=='future'?'Only new releases will download.':'Nothing downloads automatically now.');seriesPage(sr.id)});
 if(q('#sm'))q('#sm').onchange=e=>send('series/'+sr.id,'PUT',{monitored:e.target.checked?1:0}).then(()=>seriesPage(sr.id));
 q('#ss').onclick=async e=>{e.target.disabled=true;toast('Searching…');try{const r=await send('series/'+sr.id+'/search','POST');toast('Sent '+r.sent+' downloads')}catch(x){toast(x.message,1)}e.target.disabled=false};
 q('#sf').onclick=async()=>{toast('Checking…');try{const r=await send('series/'+sr.id+'/refresh','POST');toast(r.added+' new titles');seriesPage(sr.id)}catch(e){toast(e.message,1)}};
 m.querySelectorAll('[data-df]').forEach(b=>b.onclick=()=>{const x=d.items.find(y=>y.id==b.dataset.df);deleteFile(x,x.path,()=>seriesPage(sr.id))});
 q('#sd').onclick=async()=>{const n=await dlg(au?'Stop following <b>'+esc(sr.title)+'</b>? Books you downloaded or ticked stay in your library.':'Remove <b>'+esc(sr.title)+'</b>? Downloaded files stay on disk.',[[au?'Stop following':'Remove series','dg']]);if(n<0)return;await send('series/'+sr.id,'DELETE');toast(au?'No longer following '+sr.title:'Series removed');history.back()}};
 draw()}
function route(){const m=location.hash.match(/^#\/(item|series)\/(\d+)/);m?(m[1]=='item'?itemPage(+m[2]):seriesPage(+m[2])):go()}
addEventListener('hashchange',route);route();
</script></body></html>
