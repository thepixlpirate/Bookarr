<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookarr</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/bookarr.svg"><link rel="apple-touch-icon" href="/bookarr-256.png">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#2a2a2a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<script src="/initialize.js"></script>
<style>
/* ===== Theme: Readarr dark (colors and sizes taken from Readarr's own dark theme) ===== */
:root{color-scheme:dark;
 --red:#ca302d;--red2:#a41726;--red3:#66001a;--ink:#202020;--hdr:#2a2a2a;--side:#2a2a2a;--sideA:#333;--tool:#262626;--menu:#333;--menuH:#414141;
 --card:#333;--card2:#2a2a2a;--tx:#ccc;--mu:#909293;--dim:#555;--white:#fff;--line:rgba(133,133,133,.35);--lbl:#595959;
 --ok:#27c24c;--pri:#5d9cec;--warn:#ffa500;--dang:#f05050;--torrent:#00853d;--usenet:#17b1d9;
 --btn:#333;--btnB:#393f45;--btnH:#444;--green:#0b8750;--greenB:#1d563d;--inp:#333;--inpB:#4b4b4b;--focus:#66afe9;
 /* names used throughout Bookarr's code */
 --te:var(--ok);--pu:var(--red);--bl:var(--pri);--g1:var(--card2);--g2:var(--card);--black:var(--side)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--tx);font:14px/1.528571429 Roboto,"open sans","Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--white);text-decoration:none}a:hover{color:var(--red)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
/* page header */
.pghd{flex:0 0 60px;height:60px;display:flex;align-items:center;background:var(--hdr);color:var(--white);z-index:30;position:relative}
.pghd .logo{flex:0 0 210px;display:flex;align-items:center;padding-left:20px;gap:10px}.pghd .logo img{width:32px;height:32px;display:block}
.sbt{display:none;background:none;border:0;color:var(--white);width:45px;height:60px;cursor:pointer;padding:0}.sbt svg.i{width:20px;height:20px}
.hs{position:relative;display:flex;align-items:center;flex:0 1 420px;margin-left:12px}
.hs input{margin-left:8px;width:200px;border:0;border-bottom:1px solid var(--white);border-radius:0;background:transparent;color:var(--white);padding:6px 0;font:inherit;outline:none;transition:border .3s,width .3s}
.hs input:focus{border-bottom-color:transparent;width:320px}.hs input::placeholder{color:#bbb}
.sugg{position:absolute;top:44px;left:0;width:420px;max-width:92vw;background:var(--menu);border-radius:4px;box-shadow:0 6px 24px #000a;overflow:hidden;z-index:40}
.sugg .sh{padding:6px 12px;font-size:12px;color:var(--mu);background:#2a2a2a;text-transform:uppercase;letter-spacing:.03em}
.sugg a{display:flex;gap:10px;align-items:center;padding:6px 12px;color:var(--tx)}.sugg a.on,.sugg a:hover{background:var(--menuH);color:var(--white)}
.sugg img{width:30px;height:45px;object-fit:cover;background:#444;flex:none}.sugg small{display:block;color:var(--mu)}
.hr{margin-left:auto;display:flex;padding-right:15px}.hr a{width:40px;text-align:center;line-height:60px;color:var(--white)}.hr a:hover{color:var(--red)}.hr svg.i{width:18px;height:18px}
.hr a.warn{color:var(--warn)}
/* sidebar + content */
.wrap{display:flex;flex:1 1 auto;min-height:0}
#nav{flex:0 0 210px;width:210px;background:var(--side);color:#e1e2e3;overflow-y:auto;overflow-x:hidden;padding-bottom:20px}
#nav .it{border-left:3px solid transparent;transition:border-left .3s ease-in-out}#nav .it.act{border-left-color:var(--red2)}
#nav a{display:block;padding:12px 24px;color:#e1e2e3;cursor:pointer;white-space:nowrap}#nav a:hover,#nav a:focus{color:var(--red);outline:none}
#nav .it.act>a.pa{background:var(--sideA)}#nav a.ch{padding:10px 24px 10px 49px}#nav a.on{color:var(--red2)}
#nav .ic{display:inline-block;width:18px;margin-right:7px;text-align:center}
#nav .ver{padding:20px 24px 0;font-size:11px;color:var(--dim)}
.content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
/* toolbar */
#tb{flex:0 0 60px;height:60px;display:flex;justify-content:space-between;padding:0 20px;background:var(--tool);color:#e1e2e3;z-index:5;position:relative}
#tb:empty{display:none}.tbs{display:flex;align-items:stretch}
.tbtn{width:60px;padding:4px 0 0;background:none;border:0;border-radius:0;color:#e1e2e3;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;position:relative;min-height:0}
.tbtn svg.i{width:21px;height:21px;stroke-width:1.8}.tbtn .lb{height:24px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-size:11px;line-height:12px;text-align:center}
.tbtn:hover,.tbtn.on{color:var(--red)}.tbtn:disabled{color:#999;cursor:default}.tbtn.wide{width:auto;padding:4px 6px 0}
.tbsep{margin:10px 20px;height:40px;border-right:1px solid #e5e5e5;opacity:.35}
.tbin{align-self:center;margin:0 10px;height:32px;width:170px;background:var(--inp);border:1px solid var(--inpB);border-radius:4px;color:var(--white);padding:0 10px;font:inherit}
.tmenu{position:absolute;top:56px;right:0;min-width:200px;background:var(--menu);border-radius:4px;box-shadow:0 6px 24px #000b;z-index:50;padding:4px 0;line-height:normal}
.tmenu a{display:flex;justify-content:space-between;gap:16px;padding:8px 16px;color:#e1e2e3;white-space:nowrap}.tmenu a:hover{background:#606060;color:var(--red)}.tmenu a.on{color:var(--red)}
.tmenu a.on:before{content:"✓";margin-right:-6px}
main#m{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;min-width:0;min-height:0;-webkit-overflow-scrolling:touch}
/* forms + buttons (Readarr dark) */
input,select,textarea,button{font:inherit}
input,select,textarea{background:var(--inp);color:var(--tx);border:1px solid var(--inpB);border-radius:4px;padding:6px 12px;min-height:35px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--focus);box-shadow:inset 0 1px 1px rgba(0,0,0,.075),0 0 8px rgba(102,175,233,.6)}
input[readonly]{background:#222}input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--red)}
button{background:var(--btn);border:1px solid var(--btnB);color:#eee;border-radius:4px;padding:6px 16px;cursor:pointer;min-height:35px}
button:hover{background:var(--btnH);border-color:#5a6265}button:disabled{opacity:.65;cursor:default}
button.p{background:var(--green);border-color:var(--greenB);color:#fff}button.p:hover{background:#097948}
button.pu{background:var(--red);border-color:var(--red2);color:#fff}button.pu:hover{background:var(--red2)}
button.dg{background:var(--dang);border-color:#f04b4b;color:#fff}button.dg:hover{background:#ee3d3d}
button.lk{background:none;border:0;color:var(--white);padding:6px 4px;text-decoration:underline;min-height:0}button.lk:hover{color:var(--red)}
label.ck{color:var(--tx);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.f{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px 20px;max-width:900px;margin-bottom:20px;align-items:center}
.f>span{text-align:right;font-weight:700;color:var(--tx)}
/* text bits */
h2{font-size:24px;font-weight:300;margin:0 0 8px;color:var(--white)}
h3{margin:30px 0 15px;padding-bottom:6px;font-size:21px;font-weight:300;color:var(--tx);border-bottom:1px solid var(--line)}
.mu{color:var(--mu)}.empty{color:var(--mu);padding:48px 0;text-align:center}.msg{color:var(--ok);margin-left:10px}
.note{background:rgba(0,0,255,.1);border:1px solid #31708f;border-radius:4px;padding:12px 15px;margin:0 0 20px;color:var(--tx);max-width:1100px}
.help{color:var(--mu);font-size:13px;margin:8px 0;max-width:900px}.help b{color:var(--tx)}
.bad{color:var(--dang);display:block;margin-top:2px}
.pill{display:inline-block;border:1px solid var(--lbl);background:var(--lbl);color:#fff;border-radius:2px;padding:3px 6px;margin:2px 4px 2px 0;font-size:12px;line-height:1.1}
.pill.mu{background:transparent;color:var(--mu);border-color:var(--lbl)}.pill.pk{background:var(--ok);border-color:var(--ok)}.pill.wr{background:var(--warn);border-color:var(--warn);color:#222}
.pill.red{background:var(--red);border-color:var(--red)}.pill.ok{background:var(--ok);border-color:var(--ok)}.pill.pri{background:var(--pri);border-color:var(--pri)}.pill.dg{background:var(--dang);border-color:var(--dang)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.chips button{padding:4px 12px;min-height:30px}.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar2 .sp{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
/* tables */
table{width:100%;border-collapse:collapse}th{text-align:left;padding:8px;font-weight:700;color:var(--tx);white-space:nowrap}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:rgba(255,255,255,.08)}th.sort{cursor:pointer}th.sort:hover{color:var(--white)}
.tw{overflow-x:auto;max-width:100%}.fi{overflow-wrap:anywhere}.fi small{display:block;color:var(--mu)}
.x1{padding:2px 8px;min-height:0;background:none;border:0;color:var(--mu)}.x1:hover{color:var(--dang);background:none}
/* posters (Readarr author index style) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:20px 14px}
.pc{cursor:pointer;min-width:0;background:var(--card2);box-shadow:0 0 6px #111;transition:all .2s ease-in}.pc:hover,.pc:focus-visible{box-shadow:0 0 12px #000;outline:none;z-index:2}
.po{position:relative;aspect-ratio:2/3;background:#3a3a3a;overflow:hidden}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.po .tag,.po .bar,.po .ck{z-index:2}
.po .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;color:#f5f7fa;text-align:center;font-size:17px;line-height:1.3;overflow:hidden}
.po .tag{position:absolute;top:6px;left:6px;background:var(--lbl);color:#fff;font-size:11px;padding:1px 6px;border-radius:2px;text-transform:capitalize}
.po .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--dim)}
.have .bar{background:var(--ok)}.want .bar{background:var(--pri)}.miss .bar{background:var(--dang)}.off .bar{background:var(--warn)}
.pi{padding:4px 6px 6px;text-align:center;font-size:12px}.pi b{display:block;color:var(--white);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.pi small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi .bd{display:block;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.have .bd{color:var(--ok)}.want .bd{color:var(--pri)}.miss .bd{color:var(--dang)}.off .bd{color:var(--warn)}
.po .ck{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#0009;display:none;place-items:center;font-style:normal}
.selmode .po .ck{display:grid}.pc.sel .ck{background:var(--red);border-color:var(--red)}.pc.sel .ck:after{content:"✓";color:#fff;font-size:15px;font-weight:700}.pc.sel{outline:3px solid var(--red)}
.selmode .pc{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pc{-webkit-touch-callout:none}
.lfoot{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;margin:24px -20px -20px;padding:20px;background:rgba(0,0,0,.25);font-size:13px}
.lfoot .lg{display:flex;flex-wrap:wrap;gap:6px 18px}.lfoot .sq{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border-radius:1px}
/* detail pages (Readarr book/author details header) */
.ihead{position:relative;margin:-20px -20px 20px;min-height:400px;overflow:hidden;color:var(--white)}
.ihead .ibg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px);opacity:.55;transform:scale(1.05)}
.ihead .iov{position:absolute;inset:0;background:#000;opacity:.7}
.ihc{position:relative;display:flex;gap:35px;padding:30px}
.ipo{flex:0 0 250px;width:250px;align-self:flex-start;box-shadow:0 0 20px #000}
.iinfo{flex:1;min-width:0}.ititle{display:flex;align-items:center;gap:10px}
.ititle h1{margin:0;font-size:42px;line-height:1.15;font-weight:300;color:var(--white)}
.monbtn{background:none;border:0;padding:0;min-height:0;color:var(--white);cursor:pointer}.monbtn svg.i{width:30px;height:30px}.monbtn.on svg.i{fill:currentColor}.monbtn:hover{background:none;color:var(--red)}
.isub{font-size:18px;color:#ddd;margin:4px 0 10px;font-weight:300}
.ilabels{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.ilabels .pill{font-size:14px;padding:5px 9px}.ilabels a.pill:hover{background:var(--red);border-color:var(--red);color:#fff}
.syn{white-space:pre-line;max-width:1000px}.syn.cut{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.ihead .syn{color:#ddd}
.dt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 20px;max-width:1000px;margin:0}.dt dt{color:var(--mu);font-weight:700;text-align:right}.dt dd{margin:0;overflow-wrap:anywhere}
.sb{margin:6px 0;padding:8px 12px;border-radius:4px;background:rgba(255,255,255,.08);border-left:4px solid var(--dang)}.sb.have{border-left-color:var(--ok)}.sb.want{border-left-color:var(--pri)}
.dlbox{background:rgba(0,0,0,.35);border-radius:4px;padding:8px 12px;margin:0 0 12px}
.pb{height:8px;background:#727070;border-radius:4px;overflow:hidden;margin:2px 0 4px}.pb i{display:block;height:100%;background:var(--pri);transition:width .5s}
.cv{display:flex;gap:6px;align-items:center;margin-top:4px}.cv select,.cv button{padding:2px 8px;min-height:30px}
.mode label{display:block;margin:4px 0;cursor:pointer}.mode input{margin-right:6px}
.iacts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* releases list */
.rr{display:grid;grid-template-columns:minmax(0,1fr) 72px 110px 74px 64px 48px 100px;gap:10px;padding:9px 8px;border-top:1px solid var(--line);align-items:center}
.rr:hover{background:rgba(255,255,255,.08)}.rr.rh{border-top:0;font-weight:700}.rr.rh span{cursor:pointer;user-select:none}.rr.rh span:hover{color:var(--white)}
.rr .t{overflow-wrap:anywhere;color:var(--white)}.rr .c{color:var(--tx)}.rr.pick{background:rgba(39,194,76,.08)}.rsort{display:none}
.rr .tags{margin-top:4px;display:flex;flex-wrap:wrap;align-items:center}.rr .tags .lk{padding:0 8px;font-size:13px}.peek{font-size:13px;margin-top:4px}.peek td{padding:3px 8px}
.rr2{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.c-torrent{color:var(--torrent)!important}.c-usenet{color:var(--usenet)!important}
/* modal (Readarr modal) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:60}
.md{position:relative;background:#2a2a2a;border-radius:6px;width:min(1000px,100%);max-height:92vh;overflow:auto;padding:30px;box-shadow:0 5px 20px #000}
.md .x{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--mu);font-size:0;min-height:0;padding:6px}.md .x:before{content:"✕";font-size:18px}.md .x:hover{color:var(--white)}
.mh{display:grid;grid-template-columns:190px 1fr;gap:26px}.mh .po{box-shadow:0 0 12px #000}
.dgl{max-width:520px}
/* toast + selection bar */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,92vw);background:#333;border-left:4px solid var(--ok);border-radius:4px;padding:11px 16px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 16px #000a;color:#eee}
.toast.show{opacity:1}.toast.bad{border-left-color:var(--dang)}
.selbar{position:fixed;left:calc(50% + 105px);transform:translateX(-50%);bottom:16px;z-index:45;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#2a2a2a;border:1px solid var(--red);border-radius:6px;padding:10px 12px;box-shadow:0 8px 30px #000a;width:min(760px,calc(100vw - 260px))}
.selbar .sp{flex:1}.selmode main{padding-bottom:110px}.selmode .toast{bottom:120px}
.addbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.addbar .ai{display:flex;align-items:center;flex:1 1 400px;background:var(--inp);border:1px solid var(--inpB);border-radius:4px;padding-left:12px}
.addbar .ai input{flex:1;border:0;background:transparent;font-size:16px;min-height:42px}.addbar .ai input:focus{box-shadow:none}
.cal h3{font-size:18px}.cal h3.today{color:var(--red)}.cal td a{color:var(--white)}
#sbo{display:none}
/* phones (Readarr breakpoint 768px): sidebar slides in, whole page scrolls */
@media(max-width:768px){
 body{display:block;height:auto;overflow:visible}html{height:auto}
 .pghd{position:sticky;top:0}.pghd .logo{flex:0 0 auto;padding-left:0;gap:4px}.sbt{display:block}.hs{flex:1;margin-left:6px}.hs input,.hs input:focus{width:100%}.hr{padding-right:6px}.hr a{width:34px}
 .wrap{display:block}.content{display:block}
 #nav{position:fixed;top:60px;left:0;bottom:0;z-index:25;transform:translateX(-100%);transition:transform .3s ease-in-out}
 body.sbopen #nav{transform:none;box-shadow:0 0 30px #000}body.sbopen #sbo{display:block;position:fixed;inset:60px 0 0;background:rgba(0,0,0,.5);z-index:24}
 #tb{position:sticky;top:60px;padding:0 10px;overflow-x:auto;scrollbar-width:none;z-index:20}#tb::-webkit-scrollbar{display:none}.tbs{flex:none}.tbsep{margin:10px 5px}.tbin{width:120px}
 .tmenu{position:fixed;top:120px;right:8px}
 main#m{overflow:visible;padding:10px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px 8px}.po .ph{font-size:13px}
 .f{grid-template-columns:1fr}.f>span{text-align:left}input,select{font-size:16px}
 .ihead{margin:-10px -10px 16px;min-height:0}.ihc{gap:14px;padding:14px}.ipo{flex:0 0 110px;width:110px}.ititle h1{font-size:24px}.isub{font-size:15px}.ilabels .pill{font-size:12px;padding:3px 6px}
 .dt{grid-template-columns:100px minmax(0,1fr)}.dt dt{text-align:left}
 .lfoot{margin:20px -10px -10px;padding:14px}
 .ov{padding:0;align-items:stretch}.md{width:100%;max-height:100dvh;height:100dvh;border-radius:0;padding:16px}.mh{grid-template-columns:100px 1fr;gap:14px}
 .rr.rh{display:none}.rsort{display:block;margin:0 0 8px;width:100%}.rr{display:flex;flex-wrap:wrap;gap:2px 12px;padding:12px 4px}.rr .t{flex:1 1 100%}.rr .c{font-size:12px}.rr .b{margin-left:auto}
 main table.cards{display:block;overflow:visible}.cards tbody{display:block}.cards tr:first-child{display:none}
 .cards tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:12px 2px;border-top:1px solid var(--line)}.cards td{border:0;padding:0;min-width:0}
 .cards td.fi{flex:1 1 100%;font-weight:500}.cards td:has(.pb){flex:1 1 100%}.cards .fold{display:none}.cards td:last-child{margin-left:auto}.cards .cv{flex-wrap:wrap}
 .selbar{left:0;right:0;transform:none;bottom:0;width:100%;border-radius:0;border-width:1px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.selbar button{flex:1 1 auto}.selbar .sp{display:none}.selbar b{flex:1 1 100%}
 .selmode .toast{bottom:150px}.selmode main{padding-bottom:170px}
}
</style></head><body>
<header class="pghd"><div class="logo"><button class="sbt" id="sbt" aria-label="Menu"></button><a href="#/main" title="Bookarr"><img src="/bookarr.svg" alt="Bookarr"></a></div>
<div class="hs" id="hs"></div><div class="hr" id="hr"></div></header>
<div class="wrap"><nav id="nav"></nav><div id="sbo"></div><div class="content"><div id="tb"></div><main id="m"></main></div></div>
<script>
const KEY=BOOKARR.apiKey,H={'X-Api-Key':KEY,'Content-Type':'application/json'};
